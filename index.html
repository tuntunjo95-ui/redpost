<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小红书情感选题素材库</title>
  <style>
    :root {
      --bg: #fff8fb;
      --panel: #ffffff;
      --ink: #231f2b;
      --muted: #726b7e;
      --line: rgba(255, 124, 166, 0.22);
      --rose: #ff4f87;
      --rose-soft: #ffe3ee;
      --teal: #12a89d;
      --teal-soft: #d9faf6;
      --blue: #4e74ff;
      --blue-soft: #e6ecff;
      --gold: #be7a00;
      --gold-soft: #fff1c9;
      --violet: #8b5cf6;
      --mint: #35d0ad;
      --sun: #ffd166;
      --shadow: 0 18px 48px rgba(78, 116, 255, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 8%, rgba(255, 111, 173, 0.24), transparent 30%),
        radial-gradient(circle at 92% 12%, rgba(98, 220, 210, 0.28), transparent 32%),
        radial-gradient(circle at 50% 92%, rgba(122, 162, 255, 0.22), transparent 34%),
        linear-gradient(135deg, #f7fbff 0%, #fff6fc 48%, #effbff 100%);
      min-height: 100vh;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .shell {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 24px 40px;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: end;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.78);
      border-radius: 36px;
      background: linear-gradient(135deg, #ffffff, #fff6fb);
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .subline {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .view-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .view-tab {
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 999px;
      background: #ffffff;
      color: var(--muted);
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 800;
      box-shadow: 0 10px 22px rgba(78, 116, 255, 0.08);
    }

    .view-tab.active {
      color: #fff;
      background: linear-gradient(135deg, var(--rose), var(--violet));
      box-shadow: 0 14px 30px rgba(255, 79, 135, 0.28);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 112px);
      gap: 10px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 26px;
      padding: 10px 12px;
      box-shadow: var(--shadow);
    }

    .stat b {
      display: block;
      font-size: 24px;
      line-height: 1;
    }

    .stat span {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .toolbar {
      position: static;
      z-index: 10;
      display: grid;
      grid-template-columns: minmax(240px, 1fr) 170px 170px 150px;
      gap: 10px;
      margin: 18px 0;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.82);
      border-radius: 34px;
      background: linear-gradient(135deg, #fff9fd, #f0fbff);
      box-shadow: var(--shadow);
    }

    .field,
    .select {
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--ink);
      padding: 0 12px;
      outline: none;
    }

    .field:focus,
    .select:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 4px rgba(53, 208, 173, 0.18);
    }

    .layout {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 30px;
      align-items: start;
    }

    aside {
      display: grid;
      gap: 24px;
    }

    .layout > section {
      min-width: 0;
      margin-top: 36px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 30px;
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .panel h2 {
      margin: 0 0 12px;
      font-size: 15px;
      letter-spacing: 0;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      padding: 6px 10px;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
    }

    .chip.active {
      border-color: var(--rose);
      background: linear-gradient(135deg, var(--rose-soft), #fff7d6);
      color: var(--rose);
      font-weight: 700;
    }

    .keyword-list {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .keyword-list strong {
      color: var(--ink);
    }

    .cards {
      display: grid;
      gap: 24px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 30px;
      padding: 16px;
      box-shadow: var(--shadow);
      transition: transform 140ms ease, border-color 140ms ease;
    }

    .card:hover {
      transform: translateY(-1px);
      border-color: rgba(25, 114, 107, 0.44);
    }

    .card-grid {
      display: grid;
      grid-template-columns: 152px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .preview {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: linear-gradient(135deg, #fff3fb, #e9fbff);
      text-decoration: none;
    }

    .preview img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .preview-fallback {
      height: 100%;
      display: grid;
      place-items: center;
      padding: 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
      text-align: center;
    }

    .card-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: start;
    }

    .title-row {
      display: flex;
      gap: 10px;
      align-items: baseline;
    }

    .index {
      flex: 0 0 auto;
      min-width: 32px;
      height: 24px;
      display: inline-grid;
      place-items: center;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--sun), #ff8ab3);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
    }

    .card h3 {
      margin: 0;
      font-size: 18px;
      line-height: 1.35;
      letter-spacing: 0;
    }

    .meta {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .badge {
      border-radius: 999px;
      padding: 6px 9px;
      font-size: 12px;
      line-height: 1;
      white-space: nowrap;
      font-weight: 700;
    }

    .badge.theme {
      background: var(--teal-soft);
      color: var(--teal);
    }

    .badge.shape {
      background: var(--blue-soft);
      color: var(--blue);
    }

    .badge.priority {
      background: var(--gold-soft);
      color: var(--gold);
    }

    .body-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .note {
      border-top: 1px solid var(--line);
      padding-top: 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .note b {
      display: block;
      color: var(--ink);
      margin-bottom: 4px;
      font-size: 12px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .action {
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      padding: 0 12px;
      cursor: pointer;
      display: inline-grid;
      place-items: center;
      text-decoration: none;
    }

    .view {
      display: block;
    }

    .view.hidden {
      display: none;
    }

    .keyword-workspace {
      display: grid;
      gap: 16px;
      margin-top: 16px;
    }

    .keyword-hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 18px;
      border-radius: 34px;
      border: 1px solid rgba(255, 255, 255, 0.78);
      background: linear-gradient(135deg, #ffe3ee, #d9faf6);
      box-shadow: var(--shadow);
    }

    .keyword-hero h2 {
      margin: 0;
      font-size: 24px;
    }

    .keyword-hero p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .keyword-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .keyword-board {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      align-items: start;
    }

    .keyword-column {
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 30px;
      padding: 14px;
      box-shadow: var(--shadow);
    }

    .keyword-column h3 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    .keyword-add {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      margin-bottom: 10px;
    }

    .keyword-add input {
      min-width: 0;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 12px;
      outline: none;
      background: #fff;
    }

    .mini-button {
      height: 36px;
      border: 0;
      border-radius: 999px;
      padding: 0 12px;
      background: linear-gradient(135deg, var(--mint), var(--blue));
      color: #fff;
      cursor: pointer;
      font-weight: 800;
    }

    .keyword-items {
      display: grid;
      gap: 8px;
    }

    .keyword-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: #ffffff;
      padding: 8px;
    }

    .keyword-item input {
      min-width: 0;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--ink);
    }

    .delete-keyword {
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 999px;
      background: var(--rose-soft);
      color: var(--rose);
      cursor: pointer;
      font-weight: 900;
    }

    .action:hover {
      border-color: var(--rose);
      color: var(--rose);
    }

    .empty {
      display: none;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 26px;
      color: var(--muted);
      text-align: center;
      box-shadow: var(--shadow);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%) translateY(12px);
      opacity: 0;
      pointer-events: none;
      background: var(--ink);
      color: #fff;
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 13px;
      transition: opacity 160ms ease, transform 160ms ease;
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 980px) {
      .topbar,
      .layout,
      .toolbar,
      .body-grid,
      .keyword-hero,
      .keyword-board {
        grid-template-columns: 1fr;
      }

      .layout {
        row-gap: 30px;
      }

      .stats {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      aside,
      .toolbar {
        position: static;
      }

      .card-head {
        grid-template-columns: 1fr;
      }

      .card-grid {
        grid-template-columns: 120px minmax(0, 1fr);
      }

      .preview {
        position: static;
      }

      .badges {
        justify-content: flex-start;
      }
    }

    @media (max-width: 560px) {
      .shell {
        padding: 18px 14px 28px;
      }

      h1 {
        font-size: 24px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .title-row {
        align-items: flex-start;
      }

      .card-grid {
        grid-template-columns: 1fr;
      }

      .preview {
        max-height: 260px;
      }
    }
  </style>
</head>

      "69fe2690000000003502d555": { href: "https://www.xiaohongshu.com/search_result/69fe2690000000003502d555?xsec_token=AButBrCl8w0-vkc7yRhzobcg0eZkZ6DAfR7i1Y-avHon8=&xsec_source=", image: "https://sns-webpic-qc.xhscdn.com/202605191334/9f9d8e6f074806fd7dfbc25316571b94/1040g00831vts5df948005p62c4u5759eea4dqdg!nc_n_webp_mw_1" },

      "6997ffc0000000001a024be4": { href: "https://www.xiaohongshu.com/search_result/6997ffc0000000001a024be4?xsec_token=AB7CEhsjMGnGUXb899chToqtSLGv7E79CNzCZhDZSVRrU=&xsec_source=", image: "https://sns-webpic-qc.xhscdn.com/202605191334/a95dc8824648edaf6cbd280ed4ed395f/1040g00831sq4519n68005o3l1pjg8pnh4jgj31o!nc_n_webp_mw_1" },
      "67af4066000000001701c173": { href: "https://www.xiaohongshu.com/search_result/67af4066000000001701c173?xsec_token=ABik3M2qxme6w1v4hQeBSiYiir46hXh8JdRJGn_AWYEps=&xsec_source=", image: "https://sns-webpic-qc.xhscdn.com/202605191334/36cc46981661eafd53f2918bfbd83baf/1040g00831dspvib9gu005p5frv3noqhj8sua3rg!nc_n_webp_mw_1" },
      "69f56132000000003601da4a": { href: "https://www.xiaohongshu.com/search_result/69f56132000000003601da4a?xsec_token=ABuZysS2RZvCkuusNsuj1jvuENCO9iO2ivHa8G5sV9Pkw=&xsec_source=", image: "https://sns-webpic-qc.xhscdn.com/202605191334/494fb76c309e77ac0c8934256c27a6c3/1040g2sg31vl92ca3jqe04b6ei4deoploo4aurho!nc_n_webp_mw_1" },
      "68833e8f000000001c034222": { href: "https://www.xiaohongshu.com/search_result/68833e8f000000001c034222?xsec_token=ABLHcNmxZ0bCCRN14iQeeLllE6GoXmFpGKiPurJ5E3Rxc=&xsec_source=", image: "https://sns-webpic-qc.xhscdn.com/202605191334/af47e368233e5c2509db8cbcf153eed7/1040g2sg31kbr6qv030004a7fa4sa97lcpkqbceg!nc_n_webp_mw_1" }
    };

    const usablePosts = posts.filter(post => {
      const id = post.link.split("/").pop();
      const source = sourceData[id];
      return source && source.href && source.image;
    });

    const state = {
      query: "",
      theme: "all",
      shape: "all",
      priority: "all"
    };

    const cardsEl = document.querySelector("#cards");
    const emptyEl = document.querySelector("#empty");
    const totalEl = document.querySelector("#totalCount");
    const toastEl = document.querySelector("#toast");
    const themeFilter = document.querySelector("#themeFilter");
    const shapeFilter = document.querySelector("#shapeFilter");
    const priorityFilter = document.querySelector("#priorityFilter");
    const searchEl = document.querySelector("#search");
    const chipsEl = document.querySelector("#themeChips");
    const keywordBoardEl = document.querySelector("#keywordBoard");
    const copyKeywordsEl = document.querySelector("#copyKeywords");
    const resetKeywordsEl = document.querySelector("#resetKeywords");
    const materialsViewEl = document.querySelector("#materialsView");
    const keywordsViewEl = document.querySelector("#keywordsView");
    const materialsToolbarEl = document.querySelector("#materialsToolbar");
    const viewTabs = document.querySelectorAll(".view-tab");

    const defaultKeywords = {
      core: {
        title: "核心关键词",
        items: ["暗恋真实故事", "暗恋聊天记录", "分手复盘", "冷暴力恋爱", "断联后复联", "友情以上恋人未满", "暧昧拉扯", "前任突然联系"]
      },
      longtail: {
        title: "长尾关键词",
        items: ["多年后才知道被喜欢", "暗恋终止瞬间", "前任高铁重逢", "每年只发新年快乐的人", "十五年后知道你结婚", "高中暗恋的人再次见面", "断联十年的初恋对象突然联系我"]
      },
      combo: {
        title: "组合关键词",
        items: ["暗恋 + 亲身经历", "crush + 后续", "冷暴力 + 被逼分手", "分手 + 多年恋爱", "聊天记录 + 暗恋", "办公室暧昧 + 边界感", "复联 + 再断联"]
      },
      exclude: {
        title: "排除关键词",
        items: ["MBTI", "视角", "氛围感", "文案", "推文", "小说", "短剧", "塔罗", "星座", "教程", "挽回机构", "纯爽文"]
      }
    };

    function loadKeywords() {
      try {
        const saved = JSON.parse(localStorage.getItem("xhKeywordLibrary") || "null");
        if (saved && typeof saved === "object") return saved;
      } catch (error) {
        return structuredClone(defaultKeywords);
      }
      return structuredClone(defaultKeywords);
    }

    let keywordLibrary = loadKeywords();

    const themes = [...new Set(usablePosts.map(post => post.theme))];
    const shapes = [...new Set(usablePosts.map(post => post.shape))];

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    themes.forEach(theme => {
      themeFilter.append(new Option(theme, theme));
      const chip = document.createElement("button");
      chip.className = "chip";
      chip.type = "button";
      chip.textContent = theme;
      chip.dataset.theme = theme;
      chip.addEventListener("click", () => {
        state.theme = state.theme === theme ? "all" : theme;
        themeFilter.value = state.theme;
        render();
      });
      chipsEl.append(chip);
    });

    shapes.forEach(shape => {
      shapeFilter.append(new Option(shape, shape));
    });

    function saveKeywords() {
      localStorage.setItem("xhKeywordLibrary", JSON.stringify(keywordLibrary));
      renderSidebarKeywords();
    }

    function renderSidebarKeywords() {
      const list = document.querySelector(".keyword-list");
      if (!list) return;
      list.innerHTML = `
        <div><strong>核心：</strong>${keywordLibrary.core.items.map(escapeHtml).join("、") || "未设置"}</div>
        <div><strong>长尾：</strong>${keywordLibrary.longtail.items.map(escapeHtml).join("、") || "未设置"}</div>
        <div><strong>排除：</strong>${keywordLibrary.exclude.items.map(escapeHtml).join("、") || "未设置"}</div>
      `;
    }

    function renderKeywordBoard() {
      keywordBoardEl.innerHTML = Object.entries(keywordLibrary).map(([key, group]) => `
        <section class="keyword-column" data-key="${escapeHtml(key)}">
          <h3>${escapeHtml(group.title)}</h3>
          <div class="keyword-add">
            <input type="text" placeholder="新增关键词">
            <button class="mini-button" type="button">添加</button>
          </div>
          <div class="keyword-items">
            ${group.items.map((item, index) => `
              <div class="keyword-item">
                <input value="${escapeHtml(item)}" data-index="${index}" aria-label="${escapeHtml(group.title)} ${index + 1}">
                <button class="delete-keyword" type="button" data-index="${index}" aria-label="删除 ${escapeHtml(item)}">×</button>
              </div>
            `).join("")}
          </div>
        </section>
      `).join("");

      keywordBoardEl.querySelectorAll(".keyword-column").forEach(column => {
        const key = column.dataset.key;
        const addInput = column.querySelector(".keyword-add input");
        const addButton = column.querySelector(".mini-button");
        addButton.addEventListener("click", () => {
          const value = addInput.value.trim();
          if (!value) return;
          keywordLibrary[key].items.push(value);
          addInput.value = "";
          saveKeywords();
          renderKeywordBoard();
          showToast("已添加关键词");
        });
        addInput.addEventListener("keydown", event => {
          if (event.key === "Enter") addButton.click();
        });
        column.querySelectorAll(".keyword-item input").forEach(input => {
          input.addEventListener("change", () => {
            const index = Number(input.dataset.index);
            const value = input.value.trim();
            if (!value) {
              keywordLibrary[key].items.splice(index, 1);
            } else {
              keywordLibrary[key].items[index] = value;
            }
            saveKeywords();
            renderKeywordBoard();
            showToast("关键词已保存");
          });
        });
        column.querySelectorAll(".delete-keyword").forEach(button => {
          button.addEventListener("click", () => {
            keywordLibrary[key].items.splice(Number(button.dataset.index), 1);
            saveKeywords();
            renderKeywordBoard();
            showToast("关键词已删除");
          });
        });
      });
    }

    function switchView(view) {
      const showKeywords = view === "keywords";
      keywordsViewEl.classList.toggle("hidden", !showKeywords);
      materialsViewEl.classList.toggle("hidden", showKeywords);
      materialsToolbarEl.classList.toggle("hidden", showKeywords);
      viewTabs.forEach(tab => tab.classList.toggle("active", tab.dataset.view === view));
    }

    function normalized(text) {
      return String(text).toLowerCase().trim();
    }

    function visiblePosts() {
      const query = normalized(state.query);
      return usablePosts.filter(post => {
        const haystack = normalized([
          post.title,
          post.author,
          post.theme,
          post.shape,
          post.keyword,
          post.angle,
          post.question,
          post.reason
        ].join(" "));
        const matchesQuery = !query || haystack.includes(query);
        const matchesTheme = state.theme === "all" || post.theme === state.theme;
        const matchesShape = state.shape === "all" || post.shape === state.shape;
        const matchesPriority = state.priority === "all" || post.priority === state.priority;
        return matchesQuery && matchesTheme && matchesShape && matchesPriority;
      });
    }

    function cardTemplate(post, index) {
      const priorityText = post.priority === "high" ? "优先二创" : "普通候选";
      const searchText = `${post.title} ${post.author} ${post.keyword}`;
      const id = post.link.split("/").pop();
      const source = sourceData[id] || {};
      const directLink = source.href;
      const imageMarkup = `<img src="${source.image}" alt="${post.title} 原帖预览图" loading="lazy" referrerpolicy="no-referrer">`;
      return `
        <article class="card">
          <div class="card-grid">
            <a class="preview" href="${directLink}" target="_blank" rel="noreferrer">${imageMarkup}</a>
            <div>
              <div class="card-head">
                <div>
                  <div class="title-row">
                    <span class="index">${String(index + 1).padStart(2, "0")}</span>
                    <h3>${post.title}</h3>
                  </div>
                  <div class="meta">${post.author} · ${post.date} · ${post.engagement} · 搜索词：${post.keyword}</div>
                </div>
                <div class="badges">
                  <span class="badge theme">${post.theme}</span>
                  <span class="badge shape">${post.shape}</span>
                  <span class="badge priority">${priorityText}</span>
                </div>
              </div>
              <div class="body-grid">
                <div class="note"><b>二创角度</b>${post.angle}</div>
                <div class="note"><b>讨论问题</b>${post.question}</div>
                <div class="note"><b>质量判断</b>${post.reason}</div>
              </div>
              <div class="actions">
                <a class="action" href="${directLink}" target="_blank" rel="noreferrer">打开原帖</a>
                <button class="action" data-copy="${encodeURIComponent(searchText)}">复制检索词</button>
                <button class="action" data-copy="${encodeURIComponent(post.question)}">复制讨论题</button>
                <button class="action" data-copy="${encodeURIComponent(directLink)}">复制站内线索</button>
              </div>
            </div>
          </div>
        </article>
      `;
    }

    function render() {
      const list = visiblePosts();
      totalEl.textContent = list.length;
      cardsEl.innerHTML = list.map(cardTemplate).join("");
      emptyEl.style.display = list.length ? "none" : "block";
      document.querySelectorAll(".chip").forEach(chip => {
        chip.classList.toggle("active", chip.dataset.theme === state.theme);
      });
      document.querySelectorAll("[data-copy]").forEach(button => {
        button.addEventListener("click", async () => {
          const text = decodeURIComponent(button.dataset.copy);
          await navigator.clipboard.writeText(text);
          showToast(button.textContent.replace("复制", "已复制"));
        });
      });
    }

    function showToast(text) {
      toastEl.textContent = text;
      toastEl.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toastEl.classList.remove("show"), 1300);
    }

    searchEl.addEventListener("input", event => {
      state.query = event.target.value;
      render();
    });
    themeFilter.addEventListener("change", event => {
      state.theme = event.target.value;
      render();
    });
    shapeFilter.addEventListener("change", event => {
      state.shape = event.target.value;
      render();
    });
    priorityFilter.addEventListener("change", event => {
      state.priority = event.target.value;
      render();
    });
    viewTabs.forEach(tab => {
      tab.addEventListener("click", () => switchView(tab.dataset.view));
    });
    copyKeywordsEl.addEventListener("click", async () => {
      const text = Object.values(keywordLibrary)
        .map(group => `${group.title}：${group.items.join("、")}`)
        .join("\n");
      await navigator.clipboard.writeText(text);
      showToast("已复制关键词库");
    });
    resetKeywordsEl.addEventListener("click", () => {
      keywordLibrary = structuredClone(defaultKeywords);
      saveKeywords();
      renderKeywordBoard();
      showToast("已恢复默认");
    });

    renderSidebarKeywords();
    renderKeywordBoard();
    render();
  </script>
</body>
</html>
